<div class="card">
  <h2>Apache Logs</h2>

  <!-- Filters -->
  <form method="get" action="/logs/apache">
    <label>Date range:</label>
    <input type="date" name="start">
    <input type="date" name="end">

    <label>Status code:</label>
    <select name="status">
      <option value="">All</option>
      <option value="200">200</option>
      <option value="404">404</option>'
      <option value="500">500</option>
      <option value="400">400</option>
    </select>

    <button type="submit">Apply Filters</button>
  </form>

  <!-- Report section -->
  <div>
    <h3>Report</h3>
    <ul>
      <li>Total entries: 230</li>
      <li>Errors: 32</li>
      <li>Top IP: 192.168.1.1</li>
    </ul>
  </div>

  <!-- Table or log output -->
  <pre>
    127.0.0.1 - - [10/Apr/2025:13:55:36] "GET /index.html" 200
  </pre>
</div>
