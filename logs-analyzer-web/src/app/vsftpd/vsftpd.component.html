<app-log-table
  [title]="title"
  (reloadClicked)="reload()"
  (reportsClicked)="goToReports()"
  [isLoading]="isLoading"
  [columns]="columns"
  [headers]="headers"
  [rows]="rows"
  [columnTypes]="{ id: 'text', timestamp: 'date', pid: 'text', user: 'text', action: 'text', ip_address: 'text', message: 'text', extra_message: 'text'}"
>
</app-log-table>
