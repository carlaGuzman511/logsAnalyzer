<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" matSort class="full-width-table">
    
    <ng-container *ngFor="let column of columns" [matColumnDef]="column">  
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        <div class="header-cell-content">
          <div class="column-title">
            {{ getHeader(column) }}
          </div>
          <div class="column-filter">
            <ng-container [ngSwitch]="columnTypes[column]">
              <mat-form-field *ngSwitchCase="'text'" appearance="outline">
                <input matInput (keyup)="applyFilter(column, $any($event.target).value)" placeholder="Search..." />
              </mat-form-field>
              <mat-form-field *ngSwitchCase="'date'" appearance="outline">
                <input matInput [matDatepicker]="picker" (dateChange)="applyFilter(column, $event?.value)" placeholder="Choose date" />
                <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>  
              </mat-form-field>
            </ng-container>
          </div>
        </div>
      </th>
      <td mat-cell *matCellDef="let row">{{ row[column] }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns;"></tr>
  </table>
  <mat-paginator [pageSize]="10"></mat-paginator>
</div>
