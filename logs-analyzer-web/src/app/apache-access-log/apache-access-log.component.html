<app-log-table
  [title]="title"
  [isLoading]="isLoading"
  (reloadClicked)="reload()"
  (reportsClicked)="goToReports()"
  (fileSelected)="handleFileUpload($event)"
  [columns]="columns"
  [headers]="headers"
  [columnTypes]="{ id: 'text', ip_address: 'text', timestamp: 'date', method: 'text', path: 'text', status_code: 'text', user_agent: 'text', os: 'text', browser: 'text', referrer: 'text', response_size: 'text'}"
  [rows]="rows"
>
</app-log-table>
