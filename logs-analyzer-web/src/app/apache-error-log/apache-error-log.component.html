<app-log-table
  [title]="title"
  (reloadClicked)="reload()"
  (fileSelected)="handleFileUpload($event)"
  (reportsClicked)="goToReports()"
  [isLoading]="isLoading"
  [columns]="columns"
  [columnTypes]="{ id: 'text', timestamp: 'date', module: 'text', level: 'text', pid: 'text', client_ip: 'text', error_code: 'text',message: 'text'}"
  [headers]="headers"
  [rows]="rows"
>
</app-log-table>
