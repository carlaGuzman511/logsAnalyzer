<app-log-table
  [title]="title"
  (reloadClicked)="reload()"
  (fileSelected)="handleFileUpload($event)"
  (reportsClicked)="goToReports()"
  [isLoading]="isLoading"
  [columns]="columns"
  [columnTypes]="{ id: 'text', ip: 'text', timestamp: 'date', method: 'text', url: 'text', message: 'text', status_code: 'text'}"
  [headers]="headers"
  [rows]="rows"
>
</app-log-table>
