<!DOCTYPE html>
<html>
<head>
    <title>Log Reporter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
    <h1>Apache Logs</h1>
    <table class="table table-bordered">
        <tr>
            <th>
                IP
            </th>
            <th>
                Date
            </th>
            <th>
                Request
            </th>
            <th>
                Status
            </th>
            <th>
                Size
            </th>
        </tr>
        {% for log in apache_access_log %}
        <tr>
            <td>
                {{ log.ip }}
            </td>
            <td>
                {{ log.date }}
            </td>
            <td>
                {{ log.request }}
            </td>
            <td>
                {{ log.status }}
            </td>
            <td>
                {{ log.size }}
            </td>
        </tr>
        {% endfor %}
    </table>

    <h1>vsftpd Logs</h1>
    <ul>
        {% for log in vsftpd_logs %}
        <li>
            {{ log.line }}
        </li>
        {% endfor %}
    </ul>
</body>
</html>
